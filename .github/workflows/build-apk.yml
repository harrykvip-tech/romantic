name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Organize files into folders
        run: |
          mkdir -p src www assets
          if [ -f input.css ]; then mv input.css src/input.css; fi
          if [ -f index.html ]; then mv index.html www/index.html; fi
          if [ -f logo.png ]; then mv logo.png www/logo.png; fi
          for f in icon-only icon-foreground icon-background splash splash-dark; do
            if [ -f "$f.png" ]; then mv "$f.png" "assets/$f.png"; fi
          done
          if [ ! -f tailwind.config.js ]; then
            echo "module.exports={content:['./www/**/*.html'],theme:{extend:{}},plugins:[]};" > tailwind.config.js
          fi
          ls -R src www assets

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Download Padauk font
        run: |
          mkdir -p www/fonts
          curl -fsSL -o www/fonts/Padauk-Regular.ttf https://github.com/google/fonts/raw/main/ofl/padauk/Padauk-Regular.ttf || echo "font regular skipped"
          curl -fsSL -o www/fonts/Padauk-Bold.ttf https://github.com/google/fonts/raw/main/ofl/padauk/Padauk-Bold.ttf || echo "font bold skipped"

      - name: Build CSS (Tailwind)
        run: npm run build:css

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons and splash
        run: npx capacitor-assets generate --android

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk romantic.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: romantic-apk
          path: romantic.apk

      - name: Attach APK to GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: romantic.apk
