<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#eef0ff">
    <title>ရိုမန်တစ်</title>
    <link href="css/tailwind.css" rel="stylesheet">
</head>
<body class="pb-16 text-neutral-900">

    <!-- Toast Notification -->
    <div id="toast" role="status" aria-live="polite" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 hidden px-5 py-2.5 rounded-full btn-accent text-white font-bold text-xs shadow-2xl transition-all ">
        စာသား Copy ကူးပြီးပါပြီ!
    </div>

    <!-- Header -->
    <header class="sticky top-0 z-30 app-header px-4 py-3">
        <div class="max-w-lg mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="logo.png" alt="ရိုမန်တစ်" class="w-12 h-12 object-contain shrink-0">
                <div>
                    <h1 class="text-xl font-bold text-neutral-900 leading-tight">
                        ရိုမန်တစ်
                    </h1>
                    <p class="text-xs text-neutral-800">ချော့နည်း • Surprise • ဂရုစိုက်နည်း • ဆောင်ရန်/ရှောင်ရန်</p>
                </div>
            </div>
            <button id="favFilterBtn" onclick="toggleFavFilter()" class="px-3 py-1.5 rounded-xl bg-white/45 backdrop-blur-md border border-white/70 text-xs font-bold text-violet-900 flex items-center gap-1 whitespace-nowrap shrink-0">
                🤍 မှတ်သား (<span id="favCount">0</span>)
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-lg mx-auto px-3.5 pt-3.5 space-y-3.5">

        <!-- 5 MAIN CATEGORY TABS -->
        <div class="p-1.5 rounded-2xl card-glass space-y-1.5">
            <div class="grid grid-cols-2 gap-1.5">
                <button id="mainTab_coax" onclick="switchMainCategory('coax')" class="py-2.5 px-2 rounded-xl font-bold text-sm transition-all flex items-center justify-center gap-1.5 active-main-tab">
                    <span>🥺</span> ချစ်သူချော့နည်း (၁၂)
                </button>
                <button id="mainTab_surprise" onclick="switchMainCategory('surprise')" class="py-2.5 px-2 rounded-xl font-bold text-sm transition-all flex items-center justify-center gap-1.5 text-neutral-900 hover:text-violet-900 bg-white/45 backdrop-blur-md">
                    <span>🎁</span> Surprise နည်း (၁၂)
                </button>
            </div>
            <div class="grid grid-cols-3 gap-1.5">
                <button id="mainTab_care" onclick="switchMainCategory('care')" class="py-2.5 px-1.5 rounded-xl font-bold text-xs transition-all flex items-center justify-center gap-1 text-neutral-900 hover:text-violet-900 bg-white/45 backdrop-blur-md">
                    <span>💗</span> ဂရုစိုက်နည်း (၈)
                </button>
                <button id="mainTab_dodont" onclick="switchMainCategory('dodont')" class="py-2.5 px-1.5 rounded-xl font-bold text-xs transition-all flex items-center justify-center gap-1 text-neutral-900 hover:text-violet-900 bg-white/45 backdrop-blur-md">
                    <span>⚖️</span> ဆောင်/ရှောင် (၈)
                </button>
                <button id="mainTab_dict" onclick="switchMainCategory('dict')" class="py-2.5 px-1.5 rounded-xl font-bold text-xs transition-all flex items-center justify-center gap-1 text-neutral-900 hover:text-violet-900 bg-white/45 backdrop-blur-md">
                    <span>🔍</span> စကားဝှက် (၁၀)
                </button>
            </div>
        </div>

        <!-- Search & Sub-Category Filter -->
        <div class="space-y-2">
            <div class="relative">
                <input id="searchInput" type="text" oninput="renderArticles()" placeholder="ခေါင်းစဉ် သို့မဟုတ် အကြောင်းအရာ ရှာဖွေရန်..." class="w-full pl-9 pr-4 py-2.5 rounded-2xl bg-white/45 backdrop-blur-md border border-white/70 text-xs text-neutral-900 placeholder-neutral-500 focus:outline-none focus:border-violet-500">
                <span class="absolute left-3 top-2.5 text-neutral-800 text-sm">🔍</span>
            </div>

            <div class="relative">
                <input id="nameInput" type="text" maxlength="30" oninput="setPartnerName(this.value)" placeholder="ချစ်သူအမည် ထည့်ပါ (ဥပမာ - သဲလေး)" class="w-full pl-9 pr-4 py-2.5 rounded-2xl bg-white/45 backdrop-blur-md border border-white/70 text-xs text-neutral-900 placeholder-neutral-500 focus:outline-none focus:border-violet-500">
                <span class="absolute left-3 top-2.5 text-neutral-800 text-sm">💞</span>
            </div>

            <!-- Horizontal Sub-filter Pills -->
            <div id="subFilterBar" class="flex gap-1.5 overflow-x-auto no-scrollbar py-0.5 text-xs"></div>
        </div>

        <!-- Article Count Info -->
        <div class="flex justify-between items-center px-1 text-xs text-neutral-800">
            <span id="sectionTitleText" class="font-bold text-violet-900">📖 ချစ်သူချော့နည်း အပိုင်းလိုက် လမ်းညွှန်များ</span>
            <span id="itemCountText">စုစုပေါင်း ၁၂ ပိုင်း</span>
        </div>

        <!-- Articles Container -->
        <div id="articlesContainer" class="space-y-3"></div>

    </main>

    <script>
        // ==========================================
        // 1. ချစ်သူချော့နည်း အပိုင်း (၁၂) ပိုင်း
        // ==========================================
        const coaxGuides = [
            {
                id: 'c1', tag: 'အဖြစ်များဆုံး',
                title: 'အပိုင်း (၁) — စာပြန်နောက်ကျလို့ / ဖုန်းမကိုင်မိလို့ စိတ်ဆိုးနေချိန် ချော့နည်း',
                why: 'မိန်းကလေးအများစုက စာပြန်နောက်ကျရင် သူ့ကို အလေးမထားဘူး၊ ပစ်ထားတယ်လို့ ခံစားရတတ်ပါတယ်။ အထူးသဖြင့် Online ပေါ်ရောက်နေရက်နဲ့ စာမပြန်မိရင် ပိုစိတ်ဆိုးတတ်ပါတယ်။',
                steps: [
                    '၁။ ဆင်ခြေအများကြီး မပေးဘဲ "သဲလေး စောင့်နေရပြီ၊ ကိုယ်တကယ်တောင်းပန်ပါတယ်" လို့ အရင်ဆုံး အမှားဝန်ခံပါ။',
                    '၂။ စာနဲ့တင်မရပ်ဘဲ ချက်ချင်း ဖုန်းခေါ်ပါ။ တစ်ခါခေါ်လို့ မကိုင်ရင် "သဲလေး အသံလေးကြားချင်လို့ ကိုယ်ပြန်ခေါ်နေတယ်နော်" ဆိုပြီး စာပို့ထားပါ။',
                    '၃။ ဘာလုပ်နေလို့ မကိုင်မိတာလဲဆိုတာကို ရိုးရိုးသားသားနဲ့ အသေးစိတ် ရှင်းပြပါ (ဥပမာ - အလုပ်ရှုပ်နေပုံ သို့မဟုတ် ဖုန်းအားသွင်းထားမိပုံကို ဓာတ်ပုံရိုက်ပို့ပေးပါ)။',
                    '၄။ နောက်တစ်ခါ မအားခင် ကြိုပြောထားပါ့မယ်လို့ ကတိပေးပြီး သူ့စိတ်ပြေတဲ့အထိ အချိန်ပေး စကားပြောပေးပါ။'
                ],
                avoid: '❌ ရှောင်ရန်: "မင်းကလည်း ဒါလေးနဲ့ စိတ်ဆိုးရလား"၊ "အလုပ်လုပ်နေတာ နားမလည်ဘူးလား" ဆိုတဲ့ စကားမျိုး လုံးဝမပြောမိပါစေနဲ့။',
                msg: 'သဲလေးရေ... ကိုယ်ဖုန်းမကိုင်မိလိုက်လို့ သဲလေး စိတ်ပူပြီး စိတ်ဆိုးသွားပြီထင်တယ် 🥺 တကယ်တောင်းပန်ပါတယ်နော်။ ကိုယ့်အတွက် သဲလေးက အရေးကြီးဆုံးပါ၊ နောက်တစ်ခါ မအားခင် ကြိုပြောပါ့မယ်နော်။ စိတ်ဆိုးပြေပါတော့နော် ချစ်ဆုံးလေး 💖'
            },
            {
                id: 'c2', tag: 'အဖြစ်များဆုံး',
                title: 'အပိုင်း (၂) — ချိန်းထားပြီး အချိန်နောက်ကျသွားလို့ စိတ်ကောက်နေချိန် ချော့နည်း',
                why: 'မိန်းကလေးတစ်ယောက်က Date သွားဖို့ အချိန်အကြာကြီး ပြင်ဆင်ထားရတာဖြစ်လို့ ကိုယ်ကနောက်ကျသွားတဲ့အခါ သူ့ရဲ့ကြိုးစားပြင်ဆင်မှုကို တန်ဖိုးမထားသလို ခံစားရတတ်ပါတယ်။',
                steps: [
                    '၁။ လမ်းမှာကတည်းက ဘယ်နေရာရောက်နေပြီဆိုတာ ၅ မိနစ်တစ်ခါ အသိပေးပါ၊ လိမ်မပြောပါနဲ့။',
                    '၂။ ရောက်ရောက်ချင်း သူ့မျက်နှာတည်နေရင်တောင် အပြုံးမပျက်ဘဲ "ဒီနေ့ သဲလေး အရမ်းလှနေပါလား" လို့ အရင်ချီးကျူးပြီးမှ လက်အုပ်ချီပြီး ချစ်စနိုး တောင်းပန်ပါ။',
                    '၃။ လမ်းကြုံ အအေးဘူး သို့မဟုတ် သူကြိုက်တတ်တဲ့ မုန့်လေးတစ်ခု လက်ထဲအသင့်ကိုင်သွားပြီး "သဲလေး စောင့်နေရလို့ မောနေမှာစိုးလို့ ဝယ်လာတာ" ဆိုပြီး ပေးပါ။',
                    '၄။ အဲဒီနေ့ တစ်နေကုန် သူသွားချင်တဲ့နေရာ၊ သူစားချင်တဲ့အရာကို ဦးစားပေးလိုက်လျောပေးပါ။'
                ],
                avoid: '❌ ရှောင်ရန်: ကားပိတ်လို့၊ မိုးရွာလို့ ဆိုပြီး ရောက်ရောက်ချင်း ညည်းတွားပြတာမျိုး မလုပ်ဘဲ သူစောင့်လိုက်ရတာကိုပဲ အရင်အလေးထားနှစ်သိမ့်ပါ။',
                msg: 'သဲလေးကို အကြာကြီးစောင့်ခိုင်းမိသလို ဖြစ်သွားလို့ အရမ်းအားနာပြီး တောင်းပန်ပါတယ်နော် 🥺 ဒီနေ့ သဲလေး ပြင်ဆင်ထားတာ အရမ်းလှနေတာပဲ၊ စိတ်ဆိုးပြေတဲ့အနေနဲ့ ဒီနေ့ သဲလေးစားချင်သမျှ ကိုယ်အကုန် ဒကာခံမယ်နော် 💕'
            },
            {
                id: 'c3', tag: 'ဂိမ်း/သူငယ်ချင်း',
                title: 'အပိုင်း (၃) — ဂိမ်းဆော့နေမိလို့ / သူငယ်ချင်းတွေနဲ့ အချိန်ကုန်နေမိလို့ စိတ်ဆိုးချိန် ချော့နည်း',
                why: 'ဂိမ်း ဒါမှမဟုတ် အပေါင်းအသင်းတွေကို သူ့ထက် ပိုဦးစားပေးတယ်လို့ ထင်သွားတဲ့အခါ အထီးကျန်သလို ခံစားရပြီး စိတ်ကောက်တတ်ကြပါတယ်။',
                steps: [
                    '၁။ သူစိတ်ဆိုးနေမှန်း သိတာနဲ့ နောက်တစ်ပွဲ ဆက်မဆော့ဘဲ ဂိမ်းကို ချက်ချင်းပိတ်လိုက်ပါ။',
                    '၂။ "သဲလေးလောက် ဘယ်ဂိမ်းမှ အရေးမကြီးလို့ အခုပိတ်လိုက်ပြီနော်" ဆိုပြီး သူ့ကို အချိန်အပြည့်အဝ ပေးလိုက်ပါ။',
                    '၃။ နောက်ရက်တွေမှာ ဂိမ်းဆော့မယ်ဆိုရင် "သဲလေးရေ ကိုယ် နာရီဝက်လောက် ဂိမ်းဆော့လိုက်ဦးမယ်နော်၊ ပြီးရင် ဖုန်းဆက်မယ်" လို့ ခွင့်တောင်းတဲ့ အလေ့အကျင့် လုပ်ပါ။',
                    '၄။ သူပါ ကစားလို့ရမယ့် နှစ်ယောက်တွဲ ဂိမ်းပေါ့ပေါ့ပါးပါးလေးတွေ အတူတူဆော့ဖို့ ဖိတ်ခေါ်ပေးပါ။'
                ],
                avoid: '❌ ရှောင်ရန်: ဖုန်းပြောချော့နေရင်းနဲ့ နောက်ကွယ်မှာ ဂိမ်းသံထွက်နေတာ၊ ဂိမ်းဆက်နှိပ်နေတာမျိုး လုံးဝမလုပ်မိပါစေနဲ့။',
                msg: 'သဲလေးရေ... ဂိမ်းထဲစိတ်ရောက်ပြီး သဲလေးကို ပစ်ထားမိသလို ဖြစ်သွားလို့ တောင်းပန်ပါတယ်နော် 🥺 ကိုယ့်အတွက် သဲလေးရဲ့ အပြုံးလေးက ဘယ်ဂိမ်းထက်မဆို ပိုအရေးကြီးပါတယ်။ အခု ဂိမ်းပိတ်ပြီး သဲလေးနားပဲ ကပ်နေတော့မယ်နော် 💖'
            },
            {
                id: 'c4', tag: 'အရေးကြီးနေ့ရက်',
                title: 'အပိုင်း (၄) — Anniversary သို့မဟုတ် အမှတ်တရနေ့ရက် မေ့သွားမိချိန် အရေးပေါ်ချော့နည်း',
                why: 'ချစ်သူသက်တမ်းပြည့်တဲ့နေ့၊ မွေးနေ့ စတဲ့ အမှတ်တရရက်တွေက မိန်းကလေးတွေအတွက် တန်ဖိုးအထားရဆုံး နေ့ရက်တွေဖြစ်လို့ မေ့သွားရင် အရမ်းဝမ်းနည်းတတ်ကြပါတယ်။',
                steps: [

                    '၁။ "ဆေးသောက်ပြီး အိပ်လိုက်လေ" လို့ ဝတ်ကျေတန်းကျေ တစ်ကြောင်းတည်း မပြောပါနဲ့။',
                    '၂။ ဘာကြောင့်ပင်ပန်းတာလဲ စိတ်ရှည်ရှည်မေးပြီး အားရှိမယ့် စားစရာပို့ပေးတာ သို့မဟုတ် အနားမှာ သွားပြုစုပေးတာမျိုး လုပ်ပါ။'
                ],
                avoid: '💡 အကြံပြုချက်: "ကိုယ့်ကလေးလေး ဒီနေ့ တော်တော်ပင်ပန်းသွားပြီ" လို့ ချစ်စနိုးပြောပေးရုံနဲ့တင် အမောပြေသွားတတ်ပါတယ်။',
                msg: 'ကိုယ့်ရဲ့ သဲလေး ဒီနေ့ တော်တော်ပင်ပန်းသွားပြီပဲ 🥺 ကိုယ်အနားမှာရှိရင် ပခုံးလေးနှိပ်ပေးချင်လိုက်တာ... အခု အားရှိအောင် မုန့်လေးပို့ပေးမယ်နော် 💕'
            },
            {
                id: 'd9', tag: 'သဝန်တိုစကားဝှက်',
                title: 'စကားဝှက် (၉) — "ကိုယ့်ဘာသာ မှားတာပါ / ကိုယ်က အပိုလူပါ" ဟု ဝမ်းနည်းစွာ ပြောလာလျှင်',
                why: '🔍 အဓိပ္ပာယ်အမှန်: သူ အရမ်းအားငယ်ပြီး သင့်ဆီက အရေးပေးမှု မရဘူးလို့ ခံစားနေရချိန်မှာ ထွက်လာတတ်တဲ့ စကားဖြစ်ပါတယ်။',
                steps: [
                    '၁။ ချက်ချင်း ပွေ့ဖက်ထားပြီး (သို့မဟုတ် ဖုန်းဆက်ပြီး) သူဟာ ကိုယ့်ဘဝအတွက် အရေးအကြီးဆုံး လူသားဖြစ်ကြောင်း အခိုင်အမာ ပြောပြပါ။',
                    '၂။ သူ့ကို အဲဒီလို အားငယ်စိတ်ဝင်သွားစေမိတဲ့အတွက် တောင်းပန်ပြီး အချိန်ပိုပေးကာ ဂရုစိုက်ပေးပါ။'
                ],
                avoid: '⚠️ သတိပြုရန်: အဲဒီလိုပြောချိန်မှာ လျစ်လျူရှုမိရင် စိတ်ဒဏ်ရာ ရသွားတတ်ပါတယ်။',
                msg: 'သဲလေးရယ် အဲဒီလို ဘယ်တော့မှ မတွေးပါနဲ့နော် 🥺 သဲလေးက ကိုယ့်ဘဝရဲ့ အဓိကလူသားနဲ့ အချစ်ရဆုံးသူပါပဲ 💖'
            },
            {
                id: 'd10', tag: 'အလှအပစကားဝှက်',
                title: 'စကားဝှက် (၁၀) — "နောက် ၅ မိနစ်ဆို ပြီးပြီ / ထွက်လာပြီ" ဟု ပြောလာလျှင်',
                why: '🔍 အဓိပ္ပာယ်အမှန်: မိန်းကလေးတို့ရဲ့ အလှပြင်ချိန် "၅ မိနစ်" ဆိုတာ အနည်းဆုံး မိနစ် (၂၀) ကနေ (၃၀) အထိ ကြာနိုင်တယ်ဆိုတာ ကြိုတင်နားလည်ထားရပါမယ် 😄။',
                steps: [
                    '၁။ အတင်းဖုန်းဆက်ပြီး လောဆော်မယ့်အစား အေးအေးဆေးဆေး စိတ်ရှည်ရှည် စောင့်ပေးပါ။',
                    '၂။ သူထွက်လာတဲ့အခါ စောင့်ရကျိုးနပ်ကြောင်းနဲ့ အရမ်းလှနေကြောင်း ပြုံးပြုံးရွှင်ရွှင် ချီးကျူးလိုက်ပါ။'
                ],
                avoid: '💡 အကြံပြုချက်: သူအလှပြင်နေချိန် လောဆော်လိုက်ရင် စိတ်ရှုပ်ပြီး Date တစ်ခုလုံး ပျော်ရွှင်မှု လျော့သွားတတ်ပါတယ်။',
                msg: 'သဲလေး အေးအေးဆေးဆေး စိတ်တိုင်းကျ ပြင်ဆင်ပါနော် 💄 ကိုယ် အချိန်ရပါတယ်၊ လှလှလေးထွက်လာမှာကို စောင့်နေမယ်နော် 💕'
            }
        ];

        // ==========================================
        // APP STATE & RENDERING
        // ==========================================
        const categoryMeta = {
            coax: { title: '📖 ချစ်သူချော့နည်း အပိုင်းလိုက် လမ်းညွှန်များ', whyLabel: 'ဘာကြောင့် စိတ်ဆိုးရသလဲ (နားလည်ပေးရန်)', stepLabel: 'အဆင့်ဆင့် ချော့နည်း လမ်းညွှန်', data: coaxGuides },
            surprise: { title: '🎁 Surprise တိုက်နည်း အပိုင်းလိုက် လမ်းညွှန်များ', whyLabel: 'ဘာကြောင့် ဒီ Surprise က ထိရောက်သလဲ', stepLabel: 'အဆင့်ဆင့် ပြင်ဆင်ပြုလုပ်နည်း', data: surpriseGuides },
            care: { title: '💗 ချစ်သူကို အသေးစိတ် ဂရုစိုက်နည်း လမ်းညွှန်များ', whyLabel: 'ဘာကြောင့် ဒီဂရုစိုက်မှုက အရေးကြီးသလဲ', stepLabel: 'လက်တွေ့ ဂရုစိုက်ပေးရမည့် အဆင့်များ', data: careGuides },
            dodont: { title: '⚖️ အချစ်ရေးတွင် ဆောင်ရန် နှင့် ရှောင်ရန်များ', whyLabel: 'အဓိက သိထားသင့်သော အချက်', stepLabel: 'ဆောင်ရန် (✅) နှင့် ရှောင်ရန် (❌) အချက်များ', data: dodontGuides },
            dict: { title: '🔍 မိန်းကလေးတို့၏ စကားဝှက် အဘိဓာန်', whyLabel: 'စကားနောက်ကွယ်မှ အဓိပ္ပာယ်အမှန်', stepLabel: 'ဘယ်လို တုံ့ပြန်ဖြေရှင်းရမလဲ', data: dictGuides }
        };

        let activeMainCategory = 'coax';
        let activeSubTag = 'အားလုံး';
        let showOnlyFavs = false;
        const DEFAULT_NAME = 'သဲလေး';
        function safeGet(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
        function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
        let favorites = [];
        try { favorites = JSON.parse(safeGet('loveCompleteFavs', '[]')); if (!Array.isArray(favorites)) favorites = []; } catch (e) { favorites = []; }
        let partnerName = safeGet('loveCompleteName', '') || '';
        let openCardIds = ['c1', 's1', 'care1', 'dd1', 'd1'];

        function switchMainCategory(cat) {
            activeMainCategory = cat;
            activeSubTag = 'အားလုံး';
            document.getElementById('searchInput').value = '';

            ['coax', 'surprise', 'care', 'dodont', 'dict'].forEach(k => {
                const btn = document.getElementById(`mainTab_${k}`);
                const isTopRow = k === 'coax' || k === 'surprise';
                if (k === cat) {
                    btn.className = `${isTopRow ? 'py-2.5 px-2 text-sm' : 'py-2.5 px-1.5 text-xs'} rounded-xl font-bold transition-all flex items-center justify-center gap-1.5 active-main-tab`;
                } else {
                    btn.className = `${isTopRow ? 'py-2.5 px-2 text-sm' : 'py-2.5 px-1.5 text-xs'} rounded-xl font-bold transition-all flex items-center justify-center gap-1.5 text-neutral-900 hover:text-violet-900 bg-white/45 backdrop-blur-md`;
                }
            });

            document.getElementById('sectionTitleText').textContent = categoryMeta[cat].title;
            renderSubFilters();
            renderArticles();
        }

        function renderSubFilters() {
            const sourceData = categoryMeta[activeMainCategory].data;
            const tags = ['အားလုံး', ...new Set(sourceData.map(item => item.tag))];
            const bar = document.getElementById('subFilterBar');
            bar.innerHTML = '';

            tags.forEach(tag => {
                const isSelected = activeSubTag === tag;
                const btn = document.createElement('button');
                btn.className = `px-3.5 py-1.5 rounded-full font-bold whitespace-nowrap transition ${
                    isSelected ? 'btn-accent text-white shadow' : 'bg-white/45 backdrop-blur-md text-neutral-900 border border-white/70'
                }`;
                btn.textContent = tag;
                btn.onclick = () => {
                    activeSubTag = tag;
                    renderSubFilters();
                    renderArticles();
                };
                bar.appendChild(btn);
            });
        }

        function toggleFavFilter() {
            showOnlyFavs = !showOnlyFavs;
            const btn = document.getElementById('favFilterBtn');
            btn.className = showOnlyFavs
                ? "px-3 py-1.5 rounded-xl btn-accent text-white text-xs font-bold flex items-center gap-1 shadow whitespace-nowrap shrink-0"
                : "px-3 py-1.5 rounded-xl bg-white/45 backdrop-blur-md border border-white/70 text-xs font-bold text-violet-900 flex items-center gap-1 whitespace-nowrap shrink-0";
            renderArticles();
        }

        function toggleFavorite(id, e) {
            e.stopPropagation();
            if (favorites.includes(id)) {
                favorites = favorites.filter(x => x !== id);
            } else {
                favorites.push(id);
            }
            safeSet('loveCompleteFavs', JSON.stringify(favorites));
            document.getElementById('favCount').textContent = favorites.length;
            renderArticles();
        }

        function toggleCardExpand(id) {
            if (openCardIds.includes(id)) {
                openCardIds = openCardIds.filter(x => x !== id);
            } else {
                openCardIds.push(id);
            }
            renderArticles();
        }

        function personalize(text) {
            const n = (partnerName || '').trim();
            return n ? text.split(DEFAULT_NAME).join(n) : text;
        }

        function setPartnerName(v) {
            partnerName = v;
            safeSet('loveCompleteName', v);
            renderArticles();
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.remove('hidden');
            clearTimeout(showToast._t);
            showToast._t = setTimeout(() => t.classList.add('hidden'), 1800);
        }

        function findItemById(id) {
            for (const k in categoryMeta) {
                const f = categoryMeta[k].data.find(x => x.id === id);
                if (f) return f;
            }
            return null;
        }

        async function copyText(id, e) {
            e.stopPropagation();
            const item = findItemById(id);
            if (!item) return;
            const text = personalize(item.msg);
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                } else {
                    throw new Error('no clipboard api');
                }
                showToast('စာသား Copy ကူးပြီးပါပြီ!');
            } catch (err) {
                // Fallback for file:// or non-HTTPS
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                let ok = false;
                try { ok = document.execCommand('copy'); } catch (e2) {}
                document.body.removeChild(ta);
                showToast(ok ? 'စာသား Copy ကူးပြီးပါပြီ!' : 'Copy မရပါ၊ စာသားကို ကိုယ်တိုင်ရွေးကူးပါ');
            }
        }

        function renderArticles() {
            const meta = categoryMeta[activeMainCategory];
            const sourceData = meta.data;
            const query = document.getElementById('searchInput').value.trim().toLowerCase();

            const filtered = sourceData.filter(item => {
                const matchTag = activeSubTag === 'အားလုံး' || item.tag === activeSubTag;
                const matchFav = !showOnlyFavs || favorites.includes(item.id);
                const matchSearch = !query ||
                    item.title.toLowerCase().includes(query) ||
                    item.why.toLowerCase().includes(query) ||
                    item.tag.toLowerCase().includes(query) ||
                    item.msg.toLowerCase().includes(query) ||
                    item.steps.join(' ').toLowerCase().includes(query);
                return matchTag && matchFav && matchSearch;
            });

            document.getElementById('itemCountText').textContent = `စုစုပေါင်း ${filtered.length} ပိုင်း`;
            document.getElementById('favCount').textContent = favorites.length;

            const container = document.getElementById('articlesContainer');
            container.innerHTML = '';

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="card-glass rounded-2xl p-8 text-center text-neutral-800 text-sm">
                        ${showOnlyFavs && !query && favorites.length === 0 ? 'မှတ်သားထားတာ မရှိသေးပါ၊ ကတ်ပေါ်က 🤍 ကို နှိပ်ပြီး မှတ်သားပါ 💝' : 'ရှာဖွေထားသော အကြောင်းအရာ မတွေ့ရှိပါ 🥺'}
                    </div>
                `;
                return;
            }

            filtered.forEach(rawItem => {
                const item = {
                    ...rawItem,
                    title: personalize(rawItem.title),
                    why: personalize(rawItem.why),
                    steps: rawItem.steps.map(personalize),
                    avoid: personalize(rawItem.avoid),
                    msg: personalize(rawItem.msg)
                };
                const isOpen = openCardIds.includes(item.id);
                const isFav = favorites.includes(item.id);

                const card = document.createElement('div');
                card.className = "card-glass rounded-2xl overflow-hidden transition-all";

                const stepsHtml = item.steps.map(st => `
                    <div class="p-2.5 rounded-xl bg-white/75 border border-white/70 text-sm text-neutral-900 leading-relaxed">
                        ${st}
                    </div>
                `).join('');

                card.innerHTML = `
                    <!-- Card Header -->
                    <div onclick="toggleCardExpand('${item.id}')" class="p-4 cursor-pointer flex items-start justify-between gap-3 hover:bg-white/30 transition">
                        <div class="space-y-1.5">
                            <div class="flex items-center gap-2">
                                <span class="px-2.5 py-0.5 rounded-full bg-violet-200/60 border border-violet-300 text-violet-900 text-xs font-bold">
                                    ${item.tag}
                                </span>
                                <span class="text-xs text-neutral-800">${isOpen ? '▲ ပိတ်ရန်' : '▼ အပြည့်အစုံဖတ်ရန်'}</span>
                            </div>
                            <h3 class="text-sm sm:text-base font-bold text-neutral-900 leading-snug">
                                ${item.title}
                            </h3>
                        </div>
                        <button aria-label="မှတ်သားမည်" onclick="toggleFavorite('${item.id}', event)" class="p-2 rounded-xl bg-white/45 backdrop-blur-md border border-white/70 text-sm shrink-0">
                            ${isFav ? '❤️' : '🤍'}
                        </button>
                    </div>

                    <!-- Detailed Body -->
                    <div class="${isOpen ? 'block' : 'hidden'} px-4 pb-4 pt-1 space-y-3.5 border-t border-white/60">
                        <div class="p-3 rounded-xl bg-violet-100/70 border border-violet-300/50 text-sm text-neutral-900 leading-relaxed">
                            <div class="font-bold text-violet-900 mb-1">💡 ${meta.whyLabel}</div>
                            ${item.why}
                        </div>

                        <div class="space-y-2">
                            <div class="text-xs font-bold text-violet-900">
                                📌 ${meta.stepLabel}
                            </div>
                            ${stepsHtml}
                        </div>

                        <div class="p-3 rounded-xl bg-amber-100/80 border border-amber-300/70 text-xs text-amber-950 leading-relaxed">
                            ${item.avoid}
                        </div>

                        <div class="p-3.5 rounded-2xl bg-white/60 border border-violet-300/60 space-y-2.5">
                            <div class="flex items-center justify-between">
                                <span class="text-xs font-bold text-violet-900">💌 ချစ်သူထံ ပို့ပေးရန် စာသား —</span>
                                <button onclick="copyText('${item.id}', event)" class="px-3 py-1 rounded-lg btn-accent text-white font-bold text-xs shadow">
                                    📋 Copy ကူးမည်
                                </button>
                            </div>
                            <p class="text-sm text-neutral-900 font-bold leading-relaxed">
                                "${item.msg}"
                            </p>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        document.getElementById('nameInput').value = partnerName;
        renderSubFilters();
        renderArticles();
    </script>
</body>
</html>
